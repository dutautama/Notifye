# Membangun APK Android otomatis di server GitHub (tanpa PC, tanpa secrets).
# Hasil:
#   - Artifact "UsahaKonten-APK-<nomor>" di halaman run (semua branch)
#   - Release "build-<nomor>" berisi file .apk (setiap push ke main)
#     → link Release bisa dibuka langsung dari Chrome Android.
# Aplikasi 100% offline: tidak ada URL/key server yang disuntikkan.
name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'ccr-**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # dibutuhkan untuk membuat Release

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  build:
    name: Analisis, uji & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Unduh dependensi
        run: flutter pub get

      - name: Cek kode hasil generate drift sudah terbaru
        run: |
          dart run build_runner build
          if ! git diff --exit-code -- 'lib/**/*.g.dart'; then
            echo "::error title=File .g.dart usang::Jalankan build_runner lalu commit hasilnya."
            exit 1
          fi

      - name: Analisis kode
        run: flutter analyze --no-fatal-infos

      - name: Jalankan unit test (termasuk trigger SQLite)
        run: flutter test

      - name: Build APK rilis
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION="$VERSION_NAME (build ${{ github.run_number }})"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/UsahaKonten-v${VERSION_NAME}-build${{ github.run_number }}.apk"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahaKonten-APK-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14
          compression-level: 0

      - name: Terbitkan Release (unduhan langsung)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (v${{ env.VERSION_NAME }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            APK UsahaKonten v${{ env.VERSION_NAME }} — build ${{ github.run_number }} (100% offline)
            Commit: `${{ github.sha }}`

            **Cara instal dari ponsel:** ketuk file `.apk` di bawah (Assets) →
            Unduh → buka → izinkan "Instal aplikasi tidak dikenal" bila diminta.

      - name: Ringkasan
        run: |
          {
            echo "## ✅ APK siap"
            echo "- Versi: **${VERSION_NAME}** (build ${{ github.run_number }})"
            echo "- Branch main: https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }}"
            echo "- Branch lain: unduh dari bagian **Artifacts** di bawah."
          } >> "$GITHUB_STEP_SUMMARY"
