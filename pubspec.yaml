name: usahakonten
description: "UsahaKonten — manajemen usaha jasa/digital & konten media sosial."
publish_to: 'none'

# Format: <versi>+<build>. CI otomatis menimpa nomor build dengan run_number.
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_icons: ^2.0.0
  supabase_flutter: ^2.10.0
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.4
  intl: any
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
