name: usahakonten
description: "UsahaKonten — manajemen usaha jasa/digital & konten media sosial (100% offline)."
publish_to: 'none'

# Format: <versi>+<build>. CI otomatis menimpa nomor build dengan run_number.
version: 0.2.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.4
  intl: any
  url_launcher: ^6.3.0
  # Database lokal
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  # Keamanan PIN
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8
  uuid: ^4.6.0
  path_provider: ^2.1.6
  # Backup & restore
  archive: ^4.7.1
  share_plus: ^13.3.1
  file_picker: ^13.4.1
  # Master data
  mobile_scanner: ^7.5.0
  # Invoice, struk & laporan
  pdf: ^3.13.1
  print_bluetooth_thermal: ^1.2.5
  table_calendar: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
